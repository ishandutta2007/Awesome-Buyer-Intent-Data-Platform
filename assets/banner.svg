<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-wave {
        animation: wave 12s ease-in-out infinite alternate;
      }
      .signal-pulse {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .node-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .node-float-reverse {
        animation: float-rev 8s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: glow-pulse 2s ease-in-out infinite alternate;
      }

      @keyframes wave {
        0% { d: path('M0,150 Q300,90 600,150 T1200,150 L1200,300 L0,300 Z'); }
        50% { d: path('M0,130 Q300,180 600,120 T1200,160 L1200,300 L0,300 Z'); }
        100% { d: path('M0,160 Q300,110 600,170 T1200,130 L1200,300 L0,300 Z'); }
      }

      @keyframes pulse {
        0% { stroke-dashoffset: 1000; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }

      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-12px) scale(1.03); }
      }

      @keyframes float-rev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }

      @keyframes glow-pulse {
        0% { filter: drop-shadow(0 0 4px rgba(129, 140, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.8)); }
      }

      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#text-gradient);
      }

      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }

      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Dark Rich Background -->
  <rect width="1200" height="300" fill="url(#bg-gradient)" rx="16"/>

  <!-- Dynamic Wave Background (Placed deep in background) -->
  <path class="bg-wave" fill="#1e293b" opacity="0.4" d="M0,150 Q300,90 600,150 T1200,150 L1200,300 L0,300 Z" />
  
  <!-- Dynamic Signal Network Lines in Background -->
  <g opacity="0.25">
    <path stroke="url(#pulse-grad)" stroke-width="2" fill="none" stroke-dasharray="10 15" class="signal-pulse" d="M100,50 Q300,200 600,80 T1100,220" />
    <path stroke="url(#pulse-grad)" stroke-width="1.5" fill="none" stroke-dasharray="8 12" class="signal-pulse" d="M50,220 Q400,30 800,250 T1150,80" />
  </g>

  <!-- Background Decorative Nodes (Non-overlapping) -->
  <g class="node-float">
    <circle cx="120" cy="80" r="4" fill="#38bdf8" opacity="0.6"/>
    <circle cx="1080" cy="70" r="5" fill="#c084fc" opacity="0.6"/>
    <circle cx="1020" cy="240" r="3" fill="#818cf8" opacity="0.5"/>
    <line x1="120" y1="80" x2="200" y2="130" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  </g>
  
  <g class="node-float-reverse">
    <circle cx="90" cy="220" r="6" fill="#818cf8" opacity="0.5"/>
    <circle cx="1130" cy="180" r="4" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Subdued Feature Cards in Background (Positioned away from text center) -->
  <g transform="translate(950, 45)" class="node-float" opacity="0.85">
    <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="10" fill="#38bdf8" opacity="0.2"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8"/>
    <text x="44" y="26" class="pill-text">Intent Aggregation</text>
  </g>

  <g transform="translate(970, 105)" class="node-float-reverse" opacity="0.85">
    <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="10" fill="#818cf8" opacity="0.2"/>
    <circle cx="24" cy="21" r="5" fill="#818cf8"/>
    <text x="44" y="26" class="pill-text">Lead Scoring AI</text>
  </g>

  <g transform="translate(930, 165)" class="node-float" opacity="0.85">
    <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="10" fill="#c084fc" opacity="0.2"/>
    <circle cx="24" cy="21" r="5" fill="#c084fc"/>
    <text x="44" y="26" class="pill-text">ABM & Signal Capture</text>
  </g>

  <!-- FOREGROUND CONTENT - TITLE AND SUBTITLE ALWAYS CRISP AND CLEAR -->
  <g transform="translate(70, 110)">
    <!-- Radar/Signal Icon -->
    <g transform="translate(0, -38)" class="badge-glow">
      <circle cx="28" cy="28" r="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="28" cy="28" r="10" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="4" fill="#38bdf8"/>
    </g>

    <!-- Main Title -->
    <text x="72" y="0" class="title" filter="url(#glow)">Awesome Buyer Intent Data Platform</text>
    
    <!-- Subtitle -->
    <text x="72" y="42" class="subtitle">Curated B2B Buyer Intent Intelligence, ABM Platforms & Open-Source Tools 🎯</text>
    
    <!-- Dynamic Pill Badges under Subtitle -->
    <g transform="translate(72, 70)">
      <rect width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" class="pill-text" fill="#38bdf8">⚡ Live Signals</text>

      <rect x="142" width="145" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="214" y="18" text-anchor="middle" class="pill-text" fill="#818cf8">📊 Open-Source CDP</text>

      <rect x="299" width="140" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="369" y="18" text-anchor="middle" class="pill-text" fill="#c084fc">🚀 B2B Revenue AI</text>
    </g>
  </g>
</svg>
